name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  ORT_STRATEGY: download

jobs:
  # ── Lint: fmt + clippy (falla rápido sin compilar todo) ──────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest   # Linux es más rápido que windows para lint puro
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "27.x"

      - name: Cache (rust-cache)
        uses: Swatinem/rust-cache@v2
        with:
          # Caches separados por job para no mezclar perfiles
          prefix-key: "lint"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Tauri crates match the npm packages
        run: bash scripts/check-tauri-versions.sh

      - name: Clippy lints
        run: cargo clippy --locked --workspace --all-targets --exclude void-stack-desktop -- -D warnings

  # ── Tests (solo en Windows porque la suite asume rutas Windows) ──────────
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "27.x"

      - name: Cache (rust-cache)
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "test"

      # cargo test ya compila — no hace falta un `cargo build` previo
      - name: Run tests
        run: cargo test --locked --workspace --exclude void-stack-desktop
  # ── Frontend del escritorio: tipos, lint y build ─────────────────────────
  # Sin este job, un PR de npm (Dependabot) sale verde aunque rompa el
  # frontend: Lint y Test solo compilan Rust.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/void-stack-desktop/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: crates/void-stack-desktop/frontend/package-lock.json

      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check + build
        run: npm run build
