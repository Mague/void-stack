# Con Cargo.lock versionado, CI ya no se entera solo de las versiones nuevas:
# Dependabot abre un PR semanal hacia develop y CI lo prueba antes de entrar.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Tauri va en su propio PR: el crate y el paquete npm tienen que subir
      # juntos (cargo tauri build falla si no coinciden en major.minor).
      tauri:
        patterns: ["tauri", "tauri-*"]
      # Parches y minors en un solo PR para no llenar la lista
      cargo-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["tauri", "tauri-*"]

  - package-ecosystem: npm
    directory: /crates/void-stack-desktop/frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      npm-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@tauri-apps/*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
