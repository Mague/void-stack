[package]
name = "void-stack-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library: entities, config, process management, runners"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
sha2 = "0.10"
rayon = "1.10"
fastembed = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
fa-leiden-cd = { workspace = true, optional = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-dart = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-php = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-elixir = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-swift = { workspace = true, optional = true }
tree-sitter-gdscript = { workspace = true, optional = true }

[features]
default = []
# Git helpers for tests in the dependent crates (dev-dependencies only).
test-support = []
vector = ["fastembed", "ort", "notify", "fa-leiden-cd"]
structural = [
    "tree-sitter",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-dart",
    "tree-sitter-java",
    "tree-sitter-php",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-elixir",
    "tree-sitter-c-sharp",
    "tree-sitter-swift",
    "tree-sitter-gdscript",
]
full = ["vector", "structural"]
# Offline search/model benchmark (examples/vector_bench.rs). Not shipped.
bench = ["full"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }

[[example]]
name = "vector_bench"
required-features = ["bench"]
