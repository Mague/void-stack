[package]
name = "void-stack-gpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "GPU broker: leases, priority queue and VRAM accounting for a single shared GPU"

# Un programa aparte, no un modulo de void-stack-mcp: quien use void-stack sin
# GPU que repartir no se lleva un puerto ni un sondeo de NVML, y reiniciar el
# MCP (cada actualizacion) no tira los leases en curso, que viven en memoria.
[[bin]]
name = "void-gpu"
path = "src/main.rs"

[dependencies]
void-stack-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
# Carga nvml.dll en tiempo de ejecucion: compila en cualquier maquina y, si no
# hay driver NVIDIA, el broker sigue funcionando sin mediciones.
nvml-wrapper = "0.13"

# El nombre de un proceso cuando NVML lo deja en blanco (elevados, de sistema).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"
tokio = { workspace = true }
