[package]
name = "void-stack-gpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "GPU broker: leases, priority queue and VRAM accounting for a single shared GPU"

[dependencies]
void-stack-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
# La misma version mayor que void-stack-mcp: dos axum en el mismo binario son
# dos hyper, y el broker vive dentro de ese proceso.
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
# Carga nvml.dll en tiempo de ejecucion: compila en cualquier maquina y, si no
# hay driver NVIDIA, el broker sigue funcionando sin mediciones.
nvml-wrapper = "0.13"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"
tokio = { workspace = true }
