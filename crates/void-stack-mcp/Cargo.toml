[package]
name = "void-stack-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MCP server for Void Stack - exposes service management tools to AI assistants"

[[bin]]
name = "void-stack-mcp"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
void-stack-core = { workspace = true, features = ["vector", "structural"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# transport-streamable-http-server adds the HTTP transport (--http) on top
# of the workspace features; it is a tower service, hence axum to run it.
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
axum = "0.7"
# El broker de GPU, alojado en el proceso --http (ver main.rs).
schemars = { workspace = true }

[features]
default = ["vector", "structural"]
vector = ["void-stack-core/vector"]
structural = ["void-stack-core/structural"]
full = ["vector", "structural"]

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true }
